<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#334451" />
    <title>Offline — Nailong Planner</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #334451;
        color: #273540;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      header {
        display: flex;
        height: 56px;
        align-items: center;
        gap: 10px;
        padding: 0 16px;
        color: #fff;
      }
      .tile {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 4px;
        background: #fff;
        color: #334451;
        font-size: 18px;
        font-weight: 700;
      }
      .name {
        font-size: 16px;
        font-weight: 700;
      }
      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 32px 24px;
        text-align: center;
        background: #fff;
      }
      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 50%;
        background: #fce5d9;
        color: #b34000;
        font-size: 26px;
      }
      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
      }
      p {
        max-width: 320px;
        margin: 0;
        color: #586874;
        font-size: 14px;
        line-height: 1.45;
      }
      button {
        margin-top: 12px;
        padding: 11px 22px;
        border: 0;
        border-radius: 4px;
        background: #2b7abc;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      a {
        margin-top: 4px;
        color: #0e68b3;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="tile">N</span>
      <span class="name">Nailong Planner</span>
    </header>
    <main>
      <div class="mark">&#9729;</div>
      <h1>You're offline</h1>
      <p>
        Nailong will be here when you reconnect. The installed app keeps your last saved view
        available while the connection is down.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
      <a href="/">Open Nailong</a>
    </main>
  </body>
</html>
